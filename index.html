
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>ULTRON | Assistente Pessoal</title>
  <style>
    :root {
      color-scheme: dark;
      --red: #ff3030;
      --bg: #090909;
      --panel: #141414;
      --border: #292929;
      --text: #f2f2f2;
      --muted: #999;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg);
      color: var(--text); font-family: Arial, sans-serif;
    }
    button, input { font: inherit; }
    button {
      cursor: pointer; border: 1px solid var(--red);
      border-radius: 10px; padding: 12px 16px;
      background: var(--red); color: white; font-weight: bold;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .hidden { display: none !important; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 16px; border-bottom: 1px solid var(--border);
      background: #0d0d0d;
    }
    .brand {
      color: var(--red); font-size: 24px; font-weight: 900;
      letter-spacing: 4px;
    }
    .status { margin-top: 5px; color: var(--muted); font-size: 12px; }
    main { width: min(850px, 100%); margin: auto; padding: 20px 14px; }
    .panel {
      padding: 22px; border: 1px solid var(--border);
      border-radius: 16px; background: var(--panel);
    }
    h1 { margin-top: 0; }
    .accent { color: var(--red); }
    .muted { color: var(--muted); line-height: 1.6; }
    .login-card { max-width: 440px; margin: 45px auto; text-align: center; }
    .orb {
      width: 92px; height: 92px; margin: 8px auto 24px;
      border: 2px solid var(--red); border-radius: 50%;
      box-shadow: 0 0 30px #ff303044, inset 0 0 22px #ff303033;
      display: grid; place-items: center; color: var(--red);
      font-size: 30px; font-weight: 900;
    }
    .google-button {
      width: 100%; margin-top: 16px;
      background: #f2f2f2; color: #171717; border-color: #f2f2f2;
    }
    #userBar { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    #userPhoto { width: 34px; height: 34px; border-radius: 50%; }
    #logoutButton { padding: 8px 10px; background: transparent; font-size: 12px; }
    #messages {
      display: flex; flex-direction: column; gap: 12px;
      min-height: 250px; max-height: 55vh; overflow-y: auto;
      padding: 8px 2px 18px;
    }
    .message {
      max-width: 90%; padding: 13px 15px;
      border: 1px solid var(--border); border-radius: 14px;
      line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap;
    }
    .message.user { align-self: flex-end; background: #351414; border-color: #702020; }
    .message.model { align-self: flex-start; background: #1b1b1b; }
    .label {
      margin-bottom: 5px; color: var(--red); font-size: 11px;
      font-weight: bold; letter-spacing: 1px;
    }
    #chatForm {
      display: flex; gap: 9px; padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    #messageInput {
      min-width: 0; flex: 1; padding: 13px;
      border: 1px solid var(--border); border-radius: 10px;
      outline: none; background: #090909; color: white;
    }
    #messageInput:focus { border-color: var(--red); }
    #notice, #loginNotice {
      min-height: 20px; margin-top: 12px; color: var(--muted);
      font-size: 13px; white-space: pre-wrap;
    }
    #memoryBar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin: 12px 0; padding: 12px;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--muted); font-size: 12px;
    }
    #memoryBar button { padding: 8px 10px; font-size: 12px; }
    footer { padding: 20px; color: #666; font-size: 11px; text-align: center; }
    @media (max-width: 480px) {
      header { padding: 13px 10px; }
      .brand { font-size: 20px; letter-spacing: 2px; }
      main { padding: 14px 10px; }
      .panel { padding: 15px; }
      #userEmail { display: none; }
      .message { max-width: 96%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">ULTRON</div>
      <div class="status" id="status">INICIALIZANDO SISTEMA...</div>
    </div>
    <div id="userBar" class="hidden">
      <img id="userPhoto" alt="" class="hidden">
      <span id="userEmail"></span>
      <button id="logoutButton" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section id="loginScreen" class="panel login-card">
      <div class="orb">U</div>
      <h1>ACESSO <span class="accent">ULTRON</span></h1>
      <p class="muted">Autentique-se com sua conta Google para acessar seu assistente pessoal.</p>
      <button id="loginButton" class="google-button" type="button">Entrar com Google</button>
      <div id="loginNotice" role="status" class="muted"></div>
    </section>

    <section id="chatScreen" class="panel hidden">
      <h1>Olá. Eu sou o <span class="accent">ULTRON</span>.</h1>
      <p class="muted">Sistema online. Como posso ajudar?</p>

      <div id="memoryBar">
        <span id="memoryCount">Memória: carregando...</span>
        <button id="viewMemoryButton" type="button">Ver memória</button>
      </div>

      <div id="messages" aria-live="polite"></div>
      <form id="chatForm">
        <input id="messageInput" type="text" maxlength="4000"
          placeholder="Digite sua mensagem..." autocomplete="off" required>
        <button id="sendButton" type="submit">Enviar</button>
      </form>
      <div id="notice" role="status"></div>
    </section>
  </main>

  <footer>ULTRON v3 · ASSISTENTE PESSOAL</footer>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore, doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzmyFYp1DfBL71oNvrSzssSxYqPxcP_14",
      authDomain: "ultron-6a27a.firebaseapp.com",
      projectId: "ultron-6a27a",
      storageBucket: "ultron-6a27a.firebasestorage.app",
      messagingSenderId: "825972778459",
      appId: "1:825972778459:web:1cb1b29fb6fd702843f3fe"
    };

    const $ = id => document.getElementById(id);
    const loginScreen = $("loginScreen");
    const chatScreen = $("chatScreen");
    const loginButton = $("loginButton");
    const loginNotice = $("loginNotice");
    const status = $("status");
    const userBar = $("userBar");
    const messagesBox = $("messages");
    const chatForm = $("chatForm");
    const messageInput = $("messageInput");
    const sendButton = $("sendButton");
    const notice = $("notice");
    const memoryCount = $("memoryCount");

    let auth;
    let db;
    let currentUser = null;
    let history = [];
    let savedMessages = [];
    let memories = [];
    let sending = false;
    let authGeneration = 0;

    function conversationRef(user) {
      return doc(db, "users", user.uid, "conversations", "main");
    }

    function memoryRef(user) {
      return doc(db, "users", user.uid, "memories", "main");
    }

    function updateMemoryCount() {
      memoryCount.textContent = `Memória: ${memories.length} informação(ões) salva(s)`;
    }

    function showLogin(message = "") {
      loginScreen.classList.remove("hidden");
      chatScreen.classList.add("hidden");
      userBar.classList.add("hidden");
      status.textContent = "AGUARDANDO AUTENTICAÇÃO";
      loginNotice.textContent = message;
    }

    function showChat(user) {
      loginScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
      userBar.classList.remove("hidden");
      status.textContent = "SISTEMA ONLINE";
      $("userEmail").textContent = user.email || "Conta Google";

      const photo = $("userPhoto");
      if (user.photoURL) {
        photo.src = user.photoURL;
        photo.classList.remove("hidden");
      } else {
        photo.removeAttribute("src");
        photo.classList.add("hidden");
      }
    }

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = role === "user" ? "VOCÊ" : "ULTRON";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.append(label, content);
      messagesBox.appendChild(bubble);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function renderMessages(messages) {
      messagesBox.replaceChildren();
      for (const item of messages) {
        if (item && (item.role === "user" || item.role === "model") &&
            typeof item.text === "string") {
          addMessage(item.role, item.text);
        }
      }
    }

    async function loadConversation(user) {
      const generation = authGeneration;
      status.textContent = "CARREGANDO SISTEMA...";
      notice.textContent = "Carregando conversas e memória...";
      messagesBox.replaceChildren();
      history = [];
      savedMessages = [];
      memories = [];

      try {
        const [conversationSnapshot, memorySnapshot] = await Promise.all([
          getDoc(conversationRef(user)),
          getDoc(memoryRef(user))
        ]);

        if (generation !== authGeneration || currentUser?.uid !== user.uid) return;

        if (conversationSnapshot.exists()) {
          const data = conversationSnapshot.data();
          const messages = Array.isArray(data.messages) ? data.messages : [];

          savedMessages = messages
            .filter(item => item &&
              (item.role === "user" || item.role === "model") &&
              typeof item.text === "string")
            .slice(-40);

          renderMessages(savedMessages);
          history = savedMessages.slice(-12);
        }

        if (memorySnapshot.exists()) {
          const data = memorySnapshot.data();
          memories = Array.isArray(data.items)
            ? data.items
                .filter(item => typeof item === "string")
                .slice(0, 30)
            : [];
        }

        updateMemoryCount();
        notice.textContent = "Conversas e memória carregadas.";
        status.textContent = "SISTEMA ONLINE";
      } catch (error) {
        console.error("Erro ao carregar dados:", error);
        notice.textContent =
          "Erro ao carregar dados. Confira as regras do Firestore e sua conexão.";
        status.textContent = "ERRO AO CARREGAR";
      }

      if (generation === authGeneration && currentUser?.uid === user.uid) {
        messageInput.focus();
      }
    }

    async function saveConversation(user) {
      savedMessages = savedMessages.slice(-40);
      await setDoc(conversationRef(user), {
        messages: savedMessages,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function saveMemories(user) {
      memories = memories.slice(0, 30);
      await setDoc(memoryRef(user), {
        items: memories,
        updatedAt: serverTimestamp()
      }, { merge: true });
      updateMemoryCount();
    }

    function normalize(text) {
      return text.trim().toLocaleLowerCase("pt-BR");
    }

    async function handleMemoryCommand(message, user) {
      const text = message.trim();

      const rememberMatch = text.match(/^(?:ultron[, ]*)?(?:lembre que|lembre-se de que|guarde que|salve na memória que)\s+(.+)$/i);

      if (rememberMatch) {
        const fact = rememberMatch[1].trim().replace(/[.!]+$/, "");
        if (!fact) return null;

        const exists = memories.some(item => normalize(item) === normalize(fact));
        if (exists) {
          return "Essa informação já está salva na minha memória.";
        }

        memories.unshift(fact);
        memories = memories.slice(0, 30);

        try {
          await saveMemories(user);
          return `Informação salva na memória: "${fact}". Vou considerá-la nas próximas conversas.`;
        } catch (error) {
          console.error("Erro ao salvar memória:", error);
          memories = memories.filter(item => normalize(item) !== normalize(fact));
          throw new Error("Não consegui salvar essa informação. Confira as regras do Firestore.");
        }
      }

      if (/^(?:o que você lembra|o que voce lembra|ver memória|ver memoria|mostre sua memória|mostre sua memoria)\??$/i.test(text)) {
        return memories.length
          ? "Estas são as informações salvas na minha memória:\n\n" +
            memories.map((item, index) => `${index + 1}. ${item}`).join("\n")
          : "Ainda não tenho informações salvas. Você pode dizer: “Lembre que meu projeto se chama ULTRON”.";
      }

      const forgetMatch = text.match(/^(?:ultron[, ]*)?(?:esqueça que|esqueca que|apague da memória que|apague da memoria que)\s+(.+)$/i);

      if (forgetMatch) {
        const target = normalize(forgetMatch[1].replace(/[.!]+$/, ""));
        const oldMemories = [...memories];
        memories = memories.filter(item => {
          const normalized = normalize(item);
          return normalized !== target && !normalized.includes(target);
        });

        if (memories.length === oldMemories.length) {
          return "Não encontrei essa informação na memória.";
        }

        try {
          await saveMemories(user);
          return "Informação removida da memória.";
        } catch (error) {
          memories = oldMemories;
          throw new Error("Não consegui atualizar a memória no Firestore.");
        }
      }

      return null;
    }

    async function startLogin() {
      loginNotice.textContent = "";
      loginButton.disabled = true;
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });

      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        if (error.code === "auth/popup-blocked" ||
            error.code === "auth/operation-not-supported-in-this-environment") {
          try {
            await signInWithRedirect(auth, provider);
            return;
          } catch (redirectError) {
            console.error("Erro no redirecionamento:", redirectError);
            loginNotice.textContent = "Não foi possível iniciar o login.";
          }
        } else if (error.code === "auth/popup-closed-by-user") {
          loginNotice.textContent = "Login cancelado. Tente novamente.";
        } else {
          console.error("Erro no login:", error.code, error.message);
          loginNotice.textContent =
            "Falha no login. Confira os domínios autorizados e o provedor Google no Firebase.";
        }
      } finally {
        loginButton.disabled = false;
      }
    }

    loginButton.addEventListener("click", startLogin);

    $("logoutButton").addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Erro ao sair:", error);
        notice.textContent = "Não foi possível sair da conta.";
      }
    });

    $("viewMemoryButton").addEventListener("click", () => {
      addMessage(
        "model",
        memories.length
          ? "Informações na memória:\n\n" +
            memories.map((item, index) => `${index + 1}. ${item}`).join("\n")
          : "Ainda não há informações salvas. Experimente: “Lembre que meu projeto se chama ULTRON”."
      );
    });

    chatForm.addEventListener("submit", async event => {
      event.preventDefault();
      const message = messageInput.value.trim();
      if (!message || sending || !currentUser) return;

      const user = currentUser;
      const generation = authGeneration;

      sending = true;
      sendButton.disabled = true;
      messageInput.disabled = true;
      notice.textContent = "ULTRON está processando...";
      addMessage("user", message);
      messageInput.value = "";

      try {
        const memoryReply = await handleMemoryCommand(message, user);

        if (generation !== authGeneration || currentUser?.uid !== user.uid) return;

        if (memoryReply !== null) {
          addMessage("model", memoryReply);

          const pair = [
            { role: "user", text: message },
            { role: "model", text: memoryReply }
          ];

          history.push(...pair);
          history = history.slice(-12);
          savedMessages.push(...pair);
          savedMessages = savedMessages.slice(-40);

          await saveConversation(user);
          notice.textContent = "Memória atualizada e conversa salva na nuvem.";
          return;
        }

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history,
            memories
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Não foi possível obter uma resposta.");
        }

        if (typeof data.reply !== "string" || !data.reply.trim()) {
          throw new Error("O ULTRON não retornou uma resposta válida.");
        }

        if (generation !== authGeneration || currentUser?.uid !== user.uid) return;

        addMessage("model", data.reply);

        const pair = [
          { role: "user", text: message },
          { role: "model", text: data.reply }
        ];

        history.push(...pair);
        history = history.slice(-12);
        savedMessages.push(...pair);
        savedMessages = savedMessages.slice(-40);

        notice.textContent = "Salvando conversa na nuvem...";
        await saveConversation(user);

        if (generation === authGeneration && currentUser?.uid === user.uid) {
          notice.textContent = "Conversa salva na nuvem.";
        }
      } catch (error) {
        console.error("Erro no chat:", error);
        if (generation === authGeneration && currentUser?.uid === user.uid) {
          notice.textContent = error.message || "Erro de conexão. Tente novamente.";
        }
      } finally {
        sending = false;
        sendButton.disabled = false;
        messageInput.disabled = false;
        if (currentUser) messageInput.focus();
      }
    });

    async function initialize() {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        await getRedirectResult(auth).catch(error => {
          console.error("Resultado do login:", error.code, error.message);
        });

        onAuthStateChanged(auth, async user => {
          authGeneration++;
          const generation = authGeneration;
          currentUser = user;

          if (!user) {
            history = [];
            savedMessages = [];
            memories = [];
            messagesBox.replaceChildren();
            memoryCount.textContent = "Memória indisponível";
            notice.textContent = "";
            showLogin();
            return;
          }

          showChat(user);
          await loadConversation(user);
          if (generation !== authGeneration) return;
        });
      } catch (error) {
        console.error("Erro de inicialização:", error);
        status.textContent = "ERRO DE CONFIGURAÇÃO";
        showLogin("Confira a configuração do Firebase e a conexão.");
      }
    }

    initialize();
  </script>
</body>
</html>
