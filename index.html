
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100b0d">
  <title>ULTRON | Assistente Pessoal</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #100b0d;
      --panel: #1a1115;
      --red: #e53950;
      --text: #f6edf0;
      --muted: #a99aa0;
      --border: #39252d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #35151f 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .app {
      max-width: 850px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--red);
      border-radius: 14px;
      color: var(--red);
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 22px #e5395020;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status {
      margin-left: auto;
      color: #8bd9a5;
      font-size: 12px;
    }

    .status::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 25px 0;
    }

    .welcome {
      margin: auto 0;
      padding: 35px 12px;
      text-align: center;
    }

    .welcome .orb {
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border: 1px solid var(--red);
      border-radius: 50%;
      color: var(--red);
      font-size: 24px;
      box-shadow: 0 0 35px #e5395025;
    }

    .welcome h2 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .message {
      max-width: 88%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #40202a;
      border-color: #6e2d3b;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--panel);
      border-bottom-left-radius: 4px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 20%);
    }

    form {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: #1a1115;
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 150px;
      resize: vertical;
      padding: 11px;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
    }

    button {
      min-width: 48px;
      height: 46px;
      padding: 0 14px;
      border: 0;
      border-radius: 12px;
      background: var(--red);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .note {
      padding-top: 10px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 500px) {
      .app {
        padding: 14px;
      }

      .message {
        max-width: 95%;
      }

      .status {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">U</div>
      <div>
        <h1>ULTRON</h1>
        <div class="subtitle">Assistente pessoal de inteligência artificial</div>
      </div>
      <div class="status">Interface ativa</div>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="orb">U</div>
        <h2>À sua disposição.</h2>
        <p>Olá. Sou o ULTRON. Como posso ajudar você hoje?</p>
      </div>
    </section>

    <div class="composer">
      <form id="chatForm">
        <textarea
          id="messageInput"
          placeholder="Converse com o ULTRON..."
          rows="1"
          maxlength="4000"
          aria-label="Sua mensagem"
          required
        ></textarea>
        <button id="sendButton" type="submit" aria-label="Enviar mensagem">↑</button>
      </form>
      <div class="note" id="note">
        As mensagens desta sessão não são salvas na nuvem.
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const note = document.getElementById("note");

    let history = [];
    let busy = false;

    function addMessage(text, role) {
      const box = document.createElement("div");
      box.className = "message " + role;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "user" ? "VOCÊ" : "ULTRON";

      const content = document.createElement("div");
      content.textContent = text;

      box.append(label, content);
      chat.appendChild(box);
      box.scrollIntoView({ behavior: "smooth", block: "end" });

      return box;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (busy) return;

      const message = input.value.trim();
      if (!message) return;

      if (welcome) welcome.remove();

      addMessage(message, "user");
      input.value = "";
      busy = true;
      sendButton.disabled = true;
      sendButton.textContent = "…";
      note.textContent = "ULTRON está processando sua mensagem…";

      const loading = addMessage("Analisando sua solicitação…", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            history
          })
        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
          throw new Error(data.error || "Não foi possível obter uma resposta.");
        }

        addMessage(data.reply, "assistant");

        history.push(
          { role: "user", text: message },
          { role: "model", text: data.reply }
        );

        history = history.slice(-12);
        note.textContent = "Conversa em andamento. Memória na nuvem ainda não ativada.";

      } catch (error) {
        loading.remove();
        addMessage(
          "Não consegui responder: " + error.message,
          "assistant"
        );
        note.textContent = "Verifique a implantação e a configuração da API.";
      } finally {
        busy = false;
        sendButton.disabled = false;
        sendButton.textContent = "↑";
        input.focus();
      }
    });

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
